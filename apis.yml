name: Quadrata
description: 'Quadrata is a privacy-preserving on-chain identity network for Web3, issuing a non-transferable
  (soulbound) NFT "Passport" that binds verified identity, compliance and reputation attributes to a user
  wallet without storing personal data on-chain. Integrators use the Quadrata SDK and REST API to onboard
  users (KYC), businesses (KYB), and accredited/sophisticated investors, run AML risk and on-chain wallet
  screening, request consented privacy (PII) data, and query passport attributes on-chain via smart contracts
  or off-chain via API. Passport attributes include DID (sybil resistance), AML score, COUNTRY, IS_BUSINESS,
  INVESTOR_STATUS, and Cred Protocol credit score. Supported networks include Ethereum, Polygon, Arbitrum,
  Optimism, Avalanche, Evmos, and KAVA.'
